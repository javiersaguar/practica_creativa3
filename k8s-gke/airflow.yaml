apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      initContainers:
      - name: airflow-init
        image: apache/airflow:2.10.4
        imagePullPolicy: Always
        command: ["bash", "-c", "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com"]
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
        - name: dags
          mountPath: /opt/airflow/dags/retrain_model.py
          subPath: retrain_model.py
      containers:
      - name: airflow
        image: apache/airflow:2.10.4
        imagePullPolicy: Always
        command: ["bash", "-c", "airflow scheduler & airflow webserver"]
        ports:
        - containerPort: 8080
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
        - name: dags
          mountPath: /opt/airflow/dags/retrain_model.py
          subPath: retrain_model.py
      serviceAccountName: airflow-sa
      volumes:
      - name: airflow-db
        emptyDir: {}
      - name: dags
        configMap:
          name: airflow-dags
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30808
