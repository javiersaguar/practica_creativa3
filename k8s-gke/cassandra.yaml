# Deployment de una unica instancia Cassandra para tablas y resultados del pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
spec:
  replicas: 1
  strategy:
    # Recreate evita dos instancias simultaneas sin coordinacion ni almacenamiento compartido.
    type: Recreate
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      # Permite programar Cassandra incluso si el nodo tiene presion de memoria.
      tolerations:
      - key: "node.kubernetes.io/memory-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: cassandra
        image: cassandra:4.1
        ports:
        - containerPort: 9042
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "practica"
        # Ajusta el heap de Java para respetar los limites de memoria del pod.
        - name: MAX_HEAP_SIZE
          value: "768M"
        - name: HEAP_NEWSIZE
          value: "192M"
        resources:
          # requests reserva capacidad; limits impide superar estos maximos.
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1536Mi"
        readinessProbe:
          # El pod solo recibe trafico cuando cqlsh puede consultar los keyspaces.
          exec:
            command: ["cqlsh", "-e", "describe keyspaces"]
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
---
# Service interno que proporciona el DNS cassandra:9042 al resto de pods.
apiVersion: v1
kind: Service
metadata:
  name: cassandra
spec:
  # Publica el endpoint antes de estar Ready para facilitar el descubrimiento inicial.
  publishNotReadyAddresses: true
  selector:
    app: cassandra
  ports:
  - port: 9042
    targetPort: 9042
