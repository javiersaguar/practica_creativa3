apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-predictor
  template:
    metadata:
      labels:
        app: spark-predictor
    spec:
      containers:
      - name: spark-predictor
        image: europe-southwest1-docker.pkg.dev/project-6577bf93-e3eb-42be-8f6/practica/spark-predictor:latest
        imagePullPolicy: Always
        command: ["/opt/spark/bin/spark-submit"]
        args:
        - "--master"
        - "spark://spark-master:7077"
        - "--class"
        - "es.upm.dit.ging.predictor.MakePrediction"
        - "--packages"
        - "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1,org.mongodb.spark:mongo-spark-connector_2.13:10.4.1,com.datastax.spark:spark-cassandra-connector_2.13:3.5.1"
        - "--conf"
        - "spark.cassandra.connection.host=cassandra"
        - "--conf"
        - "spark.jars.ivy=/tmp/.ivy2"
        - "/app/jars/flight_prediction_2.13-0.1.jar"
        env:
        - name: PROJECT_HOME
          value: "/app"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: MONGO_URI
          value: "mongodb://mongo:27017"
        - name: CASSANDRA_HOST
          value: "cassandra"
        - name: SPARK_USER
          value: "spark"
        - name: IVY_HOME
          value: "/tmp/.ivy2"
