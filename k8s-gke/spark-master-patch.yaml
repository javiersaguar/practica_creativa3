# Parche parcial para ajustar las variables de entorno del master Spark existente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
spec:
  template:
    spec:
      containers:
      - name: spark-master
        env:
        - name: SPARK_USER
          value: "spark"
        - name: HOME
          value: "/home/spark"
        - name: SPARK_MASTER_PORT
          value: "7077"
        - name: SPARK_MASTER_HOST
          # 0.0.0.0 indica al proceso que escuche en todas las interfaces del pod.
          value: "0.0.0.0"
