apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: europe-southwest1-docker.pkg.dev/project-6577bf93-e3eb-42be-8f6/practica/kafka:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_ADVERTISED_HOST
          value: "kafka"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
