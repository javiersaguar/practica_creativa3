# Deployment MongoDB usado como sink y almacenamiento consultable de predicciones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7.0.17
        ports:
        - containerPort: 27017
      # No se declara volumen: los datos dependen del sistema de ficheros del pod.
---
# Service interno que permite conectar mediante mongodb://mongo:27017.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
