# ConfigMap con la configuracion que Prometheus leera como fichero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  # Prometheus consulta cada 15 s sus propias metricas y las de flask:5001/metrics.
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'flask'
        static_configs:
          - targets: ['flask:5001']
        metrics_path: '/metrics'
---
# Deployment del servidor que recopila y permite consultar series temporales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
        volumeMounts:
        # subPath monta la clave prometheus.yml como un unico fichero.
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      # Proyecta el contenido del ConfigMap dentro del contenedor.
      - name: config
        configMap:
          name: prometheus-config
---
# Publica la interfaz y API PromQL por el puerto 30909 de los nodos.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30909
